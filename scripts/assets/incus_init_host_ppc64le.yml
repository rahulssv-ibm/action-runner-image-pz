config: {}
networks:
  - config:
      bridge.mtu: "1460"
      ipv4.address: auto
      ipv4.firewall: "false"
      ipv4.nat: "true"
      ipv6.address: auto
      ipv6.firewall: "false"
      ipv6.nat: "true"
    description: Default Incus bridge for ppc64le
    name: incusbr0
    type: bridge
    project: default
storage_pools:
  - config:
      lvm.thinpool_name: LXDThinPool
      lvm.vg.force_reuse: "true"
      lvm.vg_name: vg_lxc
      source: vg_lxc
      volatile.initial_source: vg_lxc
      volume.size: 150GiB
    description: Incus LVM storage pool sharing vg_lxc with LXD
    name: default
    driver: lvm
storage_volumes: []
profiles:
  - config:
      boot.autostart: "true"
      limits.memory.hotplug: "false"
      linux.kernel_modules: ip_vs,ip_vs_rr,ip_vs_wrr,ip_vs_sh,ip_tables,ip6_tables,netlink_diag,nf_nat,overlay,br_netfilter
      raw.lxc: |
        lxc.mount.auto=proc:rw sys:rw cgroup:rw
        lxc.cgroup.devices.allow=a
        lxc.cap.drop=
      security.nesting: "true"
    description: Default Incus profile
    devices:
      eth0:
        name: eth0
        network: incusbr0
        type: nic
      root:
        path: /
        pool: default
        type: disk
    name: default
    project: ""
projects:
  - config:
      features.images: "true"
      features.networks: "true"
      features.networks.zones: "true"
      features.profiles: "true"
      features.storage.buckets: "true"
      features.storage.volumes: "true"
    description: Default Incus project
    name: default

